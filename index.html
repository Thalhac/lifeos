<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1">
<title>LIFEOS — Your day. Your rules.</title>
<style>
:root{--bg:#0B1220;--card:#121C2E;--acc:#14B8A6;--gold:#F5C451;--txt:#F8FAFC;--mut:#94A3B8;--brd:#1E2D47;--teal:#14B8A6;--gold2:#F5C451;--em:#10B981;--or:#F97316;--bl:#60A5FA;--pu:#A78BFA;--r:16px}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
body{background:var(--bg);color:var(--txt);font-family:'Segoe UI',system-ui,-apple-system,Roboto,Inter,sans-serif;min-height:100vh;padding-bottom:96px}
a{color:var(--acc)}
.top{position:sticky;top:0;z-index:50;background:rgba(11,18,32,.96);backdrop-filter:blur(8px);border-bottom:1px solid var(--brd);padding:14px 18px;display:flex;align-items:center;gap:12px}
.logo{width:38px;height:38px;border-radius:12px;background:linear-gradient(135deg,#14B8A6,#0d9488);display:flex;align-items:center;justify-content:center;font-weight:800;font-size:18px;color:#062a26}
.top h1{font-size:20px;letter-spacing:3px}.top small{display:block;font-size:11px;color:var(--mut);letter-spacing:.5px;font-weight:400}
.wrap{max-width:920px;margin:0 auto;padding:18px 16px}
.card{background:var(--card);border:1px solid var(--brd);border-radius:var(--r);padding:18px;margin-bottom:14px}
.card h2{font-size:13px;letter-spacing:2px;color:var(--mut);margin-bottom:10px;font-weight:600}
.big{font-size:24px;font-weight:700}.sub{color:var(--mut);font-size:14px}
.row{display:flex;gap:10px;flex-wrap:wrap}.grow{flex:1;min-width:140px}
.btn{background:var(--acc);color:#042825;border:none;border-radius:12px;padding:13px 18px;font-size:15px;font-weight:700;cursor:pointer;transition:transform .12s,opacity .12s}
.btn:active{transform:scale(.97)}.btn.ghost{background:transparent;color:var(--txt);border:1px solid var(--brd)}
.btn.gold{background:var(--gold);color:#3a2a00}.btn.warn{background:#7f1d1d;color:#fecaca}.btn.sm{padding:8px 12px;font-size:13px}
.btn:disabled{opacity:.45;cursor:not-allowed}
input,select,textarea{background:#0B1220;border:1px solid var(--brd);color:var(--txt);border-radius:10px;padding:11px 12px;font-size:15px;width:100%;font-family:inherit}
input:focus,select:focus,textarea:focus{outline:2px solid var(--acc);outline-offset:0}
label{font-size:13px;color:var(--mut);display:block;margin:10px 0 5px}
.badge{display:inline-flex;align-items:center;gap:6px;font-size:12px;font-weight:700;padding:4px 10px;border-radius:99px;border:1px solid var(--brd);color:var(--mut)}
.badge.live{color:#4ade80;border-color:#14532d}.badge.live .dot{background:#4ade80;animation:pl 1.2s infinite}
.badge.rest{color:var(--gold);border-color:#57500f}.dot{width:8px;height:8px;border-radius:50%;background:var(--mut)}
@keyframes pl{50%{opacity:.3}}
.item{background:#0B1220;border:1px solid var(--brd);border-radius:12px;padding:12px 14px;margin:8px 0;display:flex;gap:10px;align-items:center}
.item .t{flex:1}.item .tt{font-weight:600;font-size:15px}.item .mm{font-size:13px;color:var(--mut)}
.pill{font-size:11px;font-weight:700;padding:3px 9px;border-radius:99px;text-transform:uppercase;letter-spacing:.5px}
.p-High{background:#7f1d1d;color:#fecaca}.p-Medium{background:#573f08;color:#fde68a}.p-Low{background:#134e4a;color:#99f6e4}
.st-done{opacity:.6}.st-done .tt{text-decoration:line-through}
.voicebtn{width:100%;padding:22px;border-radius:20px;border:2px solid var(--acc);background:rgba(20,184,166,.08);color:var(--txt);font-size:18px;font-weight:800;cursor:pointer;display:flex;align-items:center;justify-content:center;gap:12px}
.voicebtn.listening{background:rgba(20,184,166,.22);animation:pl 1s infinite}
.chat{max-height:330px;overflow-y:auto;display:flex;flex-direction:column;gap:8px;margin:10px 0}
.msg{padding:10px 14px;border-radius:12px;font-size:14px;line-height:1.5;max-width:92%}
.msg.ai{background:#0B1220;border:1px solid var(--brd);align-self:flex-start}
.msg.me{background:rgba(20,184,166,.16);border:1px solid #134e4a;align-self:flex-end}
.timer{font-size:64px;font-weight:800;text-align:center;font-variant-numeric:tabular-nums;letter-spacing:2px}
.reps{font-size:56px;font-weight:800;text-align:center}
video#cam{width:100%;border-radius:14px;background:#000;aspect-ratio:4/3;object-fit:cover}
.nav{position:fixed;bottom:0;left:0;right:0;background:rgba(11,18,32,.97);border-top:1px solid var(--brd);display:flex;overflow-x:auto;z-index:50;padding:6px 4px calc(8px + env(safe-area-inset-bottom))}
.nav button{flex:1;min-width:62px;background:none;border:none;color:var(--mut);font-size:10px;padding:8px 4px;cursor:pointer;border-radius:10px;font-family:inherit}
.nav button.on{color:var(--acc)}.nav button .ic{font-size:20px;display:block;margin-bottom:2px}
.view{display:none}.view.on{display:block;animation:fd .2s}
@keyframes fd{from{opacity:0;transform:translateY(6px)}}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
@media(max-width:560px){.grid2{grid-template-columns:1fr}.timer{font-size:52px}}
.bar{height:8px;background:#0B1220;border-radius:99px;overflow:hidden;margin-top:8px;border:1px solid var(--brd)}
.bar i{display:block;height:100%;background:var(--acc);border-radius:99px;transition:width .4s}
.kv{display:flex;justify-content:space-between;padding:9px 0;border-bottom:1px solid var(--brd);font-size:14px}
.kv:last-child{border:none}.kv b{font-variant-numeric:tabular-nums}
.sugg{border-left:3px solid var(--acc);padding:10px 14px;background:rgba(20,184,166,.06);border-radius:0 12px 12px 0;font-size:14px;margin:8px 0}
.toast{position:fixed;top:70px;left:50%;transform:translateX(-50%);background:#1e293b;border:1px solid var(--acc);padding:12px 20px;border-radius:12px;z-index:99;font-size:14px;display:none;max-width:90%}
.tgl{display:flex;align-items:center;justify-content:space-between;padding:10px 0;border-bottom:1px solid var(--brd);font-size:14px}
.tgl input{width:44px;accent-color:var(--acc)}
.tag{font-size:11px;padding:2px 8px;border-radius:99px;background:#1e293b;color:var(--mut)}
.progress-ring{font-size:13px;color:var(--mut)}
h3.sec{font-size:16px;margin:4px 0 10px}
:focus-visible{outline:2px solid var(--acc);outline-offset:2px}
</style>
</head>
<body>
<div class="top"><div class="logo">L</div><h1>LIFEOS<small>Your day. Your rules.</small></h1>
<span style="flex:1"></span><span class="badge" id="clock">--:--</span></div>
<div class="toast" id="toast" role="alert"></div>
<div class="wrap" id="app"></div>
<nav class="nav" id="nav" aria-label="Main navigation"></nav>

<script>
/* ============ LIFEOS — single-file functional OS ============ */
const $=s=>document.querySelector(s);
const LS='lifeos_v1';
const DEF={user:{name:'',tz:Intl.DateTimeFormat().resolvedOptions().timeZone,prayerCity:'Mecca',prayerMethod:4,studyLen:45,workoutTime:'18:00',coachStyle:'balanced'},
 tasks:[],acts:[],study:[],workouts:[],goals:[],quran:[],rems:[],mem:[],prayDone:{},log:[],prefs:{notif:true,quietStart:'22:00',quietEnd:'06:00',remStudy:true,remPrayer:true,remWorkout:true}};
let S; try{S=JSON.parse(localStorage.getItem(LS))||structuredClone(DEF)}catch{S=structuredClone(DEF)}
S={...structuredClone(DEF),...S};
const save=()=>localStorage.setItem(LS,JSON.stringify(S));
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,6);
const fmtT=ms=>{ms=Math.max(0,ms);const s=Math.floor(ms/1000);return String(Math.floor(s/60)).padStart(2,'0')+':'+String(s%60).padStart(2,'0')};
const hm=d=>{d=new Date(d);return d.toLocaleTimeString([], {hour:'numeric',minute:'2-digit'})};
const todayStr=()=>new Date().toISOString().slice(0,10);
function toast(m){const t=$('#toast');t.textContent=m;t.style.display='block';clearTimeout(t._x);t._x=setTimeout(()=>t.style.display='none',2600)}
function log(type,payload){S.log.push({id:uid(),type,timestamp:Date.now(),payload});if(S.log.length>300)S.log=S.log.slice(-300);save()}

/* ---- runtime (timers/workout/focus) — single source of truth ---- */
const RT={focus:null,workout:null,restUntil:0,chat:[{from:'ai',text:'Salaam, Sir. I am LIFEOS. Ask me anything — "What should I do?", "Start Physics", "Start workout", "Remind me at 8".'}]};
setInterval(()=>{const c=$('#clock');if(c)c.textContent=new Date().toLocaleTimeString([],{hour:'2-digit',minute:'2-digit'});tick()},500);

/* ---- prayer times: real API (Aladhan) with honest fallback ---- */
let PRAY=null;
async function loadPrayer(){
 try{const m=S.user.prayerMethod||4;
  const r=await fetch(`https://api.aladhan.com/v1/timingsByCity/${new Date().toISOString().slice(0,10)}?city=${encodeURIComponent(S.user.prayerCity)}&country=Saudi%20Arabia&method=${m}`);
  const j=await r.json();const t=j.data.timings;
  PRAY=['Fajr','Dhuhr','Asr','Maghrib','Isha'].map(n=>({name:n,time:t[n].slice(0,5)}));
 }catch{PRAY=null}
 render();
}
function nextPrayer(){
 if(!PRAY)return null;const now=new Date();const hmnow=now.getHours()*60+now.getMinutes();
 for(const p of PRAY){const[h,m]=p.time.split(':').map(Number);if(h*60+m>hmnow)return{...p,mins:h*60+m-hmnow}}
 return{...PRAY[0],mins:(24*60-hmnow)+( +PRAY[0].time.slice(0,2)*60 + +PRAY[0].time.slice(3)),tomorrow:true};
}

/* ---- derived state ---- */
function activeFocus(){return RT.focus&&RT.focus.status==='active'?RT.focus:null}
function nowAct(){
 if(RT.workout&&['ACTIVE','RESTING','PAUSED'].includes(RT.workout.state))return{icon:'🏋️',title:'Workout — '+RT.workout.exercise,live:'LIVE WORKOUT',color:'var(--or)'};
 if(activeFocus())return{icon:'📚',title:RT.focus.subject+(RT.focus.topic?' · '+RT.focus.topic:''),live:'FOCUS MODE',color:'var(--teal)'};
 const now=new Date();const t=S.acts.filter(a=>a.status!=='done'&&a.status!=='cancelled'&&new Date(a.start)<=now&&new Date(a.end)>=now).sort((a,b)=>new Date(a.start)-new Date(b.start))[0];
 if(t)return{icon:ic(t.type),title:t.title,sub:hm(t.start)+' — '+hm(t.end),color:c(t.type)};
 const up=S.acts.filter(a=>a.status!=='done'&&a.status!=='cancelled'&&new Date(a.start)>=now).sort((a,b)=>new Date(a.start)-new Date(b.start))[0];
 if(up)return{icon:ic(up.type),title:up.title,sub:hm(up.start),idle:true,color:c(up.type)};
 return null;
}
function nextEv(){
 const now=new Date();
 const acts=S.acts.filter(a=>['pending','active'].includes(a.status)&&new Date(a.end)>=now).sort((a,b)=>new Date(a.start)-new Date(b.start));
 const np=nextPrayer();let best=acts[0]?{icon:ic(acts[0].type),title:acts[0].title,when:acts[0].start,mins:Math.round((new Date(acts[0].start)-now)/60000)}:null;
 if(np&&(!best||np.mins<best.mins))best={icon:'🕌',title:np.name+(np.tomorrow?' (tomorrow)':''),when:np.time,mins:np.mins,prayer:true};
 const up=S.rems.filter(r=>r.enabled&&new Date(r.time)>=now).sort((a,b)=>new Date(a.time)-new Date(b.time))[0];
 if(up){const m=Math.round((new Date(up.time)-now)/60000);if(!best||m<best.mins)best={icon:'⏰',title:up.title,when:up.time,mins:m}}
 return best;
}
const ic=t=>({study:'📚',workout:'🏋️',prayer:'🕌',quran:'📖',goal:'🎯',task:'✅',reminder:'⏰'}[t]||'📌');
const c=t=>({study:'var(--teal)',prayer:'var(--gold2)',quran:'var(--em)',workout:'var(--or)',goal:'var(--pu)'}[t]||'var(--bl)');
function todayStats(){
 const t0=new Date();t0.setHours(0,0,0,0);
 const st=S.study.filter(s=>s.startTime>=t0.getTime()&&s.status==='done').reduce((a,s)=>a+s.duration,0);
 const w=S.workouts.filter(w=>w.date===todayStr());
 const reps=w.reduce((a,x)=>a+x.sets.reduce((b,s)=>b+s.actualReps,0),0);
 const tk=S.tasks.filter(t=>t.status==='done'&&new Date(t.updatedAt)>=t0).length;
 const q=S.quran.find(q=>q.date===todayStr());
 return{study:st,reps,wsets:w.reduce((a,x)=>a+x.sets.length,0),tasks:tk,quran:q?1:0};
}
function suggestion(){
 const n=nextEv(),st=todayStats();
 if(activeFocus())return'Focus active — I will guard your time until the session ends.';
 if(RT.workout&&RT.workout.state==='ACTIVE')return'Workout live. Say "pause", "rest 30 seconds", or "switch to squats".';
 if(n&&n.mins<=15&&n.mins>=0)return`"${n.title}" starts in ${n.mins} min. Wrap up and prepare.`;
 if(n&&n.mins>15&&n.mins<60)return`You have ${n.mins} minutes free before ${n.title}. A short review would fit here.`;
 const pend=S.tasks.filter(t=>t.status!=='done').length;
 if(pend)return`You have ${pend} open task${pend>1?'s':''}. Say "what should I do?" and I will pick the priority.`;
 return'Your day is clear. Say "add goal" or "schedule study" to plan ahead, Sir.';
}

/* ================= AI BRAIN ================= */
function aiReply(text){
 RT.chat.push({from:'me',text});let out='';
 const t=text.toLowerCase().trim();
 const num={one:1,two:2,three:3,four:4,five:5,ten:10,fifteen:15,twenty:20,thirty:30}[t.match(/one|two|three|four|five|ten|fifteen|twenty|thirty/)?.[0]]||parseInt(t.match(/\d+/)?.[0]);
 const mins=t.match(/(\d+)\s*(min|sec)/);
 try{
 if(/^(hi|hello|salaam|hey)\b/.test(t)){out='Salaam, Sir. Your command center is ready. Say "brief me" for your day.'}
 else if(/brief|my day|summary/.test(t)){out=brief()}
 else if(/what.*(now|doing)|current/.test(t)){const n=nowAct();out=n?`Now: ${n.title}${n.sub?' — '+n.sub:''}.`:'Nothing is active right now, Sir.'}
 else if(/what.*next/.test(t)){const n=nextEv();out=n?`Next: ${n.title} ${typeof n.when==='string'? 'at '+n.when:'at '+hm(n.when)} (in ${n.mins} min).`:'Nothing scheduled next.'}
 else if(/what should i do|recommend|suggest/.test(t)){out=suggestion()}
 else if(/complete.*today|done today|finished today|what.*completed/.test(t)){const s=todayStats();out=`Today: ${Math.round(s.study/60000)} min study, ${s.reps} workout reps, ${s.tasks} tasks done, Quran ${s.quran?'done':'pending'}.`}
 else if(/how much.*stud/.test(t)){const s=todayStats();out=`You have studied ${Math.round(s.study/60000)} minutes today, Sir.`}
 else if(/start.*(workout|exercise|train)/.test(t)){startWorkout();out='Workout started. Push-ups first — camera is ready when you enable it. Say "pause" or "switch to squats" anytime.'}
 else if(/^(pause|hold)\b/.test(t)){if(RT.workout&&RT.workout.state==='ACTIVE'){RT.workout.state='PAUSED';out='Workout paused.'}else if(activeFocus()){pauseFocus();out='Study paused.'}else out='Nothing active to pause.'}
 else if(/^resume|continue/.test(t)){if(RT.workout&&RT.workout.state==='PAUSED'){RT.workout.state='ACTIVE';out='Continuing.'}else if(RT.focus&&RT.focus.status==='paused'){resumeFocus();out='Study resumed.'}else out='Nothing paused.'}
 else if(/stop.*workout|end.*workout|finish.*workout/.test(t)){if(RT.workout){stopWorkout(true);out='Workout stopped and saved.'}else out='No workout is running.'}
 else if(/switch to (\w+)/.test(t)){const e=t.match(/switch to (\w+)/)[1];if(RT.workout){RT.workout.exercise=cap(e);RT.workout.sets.push({n:RT.workout.sets.length+1,reps:0});RT.workout.state='ACTIVE';log('workout',{ev:'switch',to:e});out=`Switching to ${e}.`}else out='Start a workout first.'}
 else if(/rest (\d+)/.test(t)){const s=+t.match(/rest (\d+)/)[1]*(/hour/.test(t)?3600:/min/.test(t)?60:1);if(RT.workout){startRest(s);out=`Rest timer started: ${fmtT(s*1000)}.`}else out='Start a workout first.'}
 else if(/how many|reps|count/.test(t)){if(RT.workout){const r=RT.workout.sets.reduce((a,s)=>a+s.reps,0);out=`You have completed ${r} reps of ${RT.workout.exercise}.`}else out='No workout running.'}
 else if(/start (.+)/.test(t)){const sub=cap(t.match(/start (.+)/)[1].replace(/session|study|focus/g,'').trim());startFocus(sub||'General',45);out=`Study session started: ${sub||'General'}, 45 minutes. Say "pause" or "complete" anytime.`}
 else if(/start a (\d+).*minute/.test(t)){const m=+t.match(/start a (\d+)/)[1];startFocus('General',m);out=`${m}-minute focus session started.`}
 else if(/add (\d+).*min/.test(t)){if(activeFocus()){RT.focus.total+=+t.match(/add (\d+)/)[1]*60000;out='Time added.'}else out='No active session.'}
 else if(/time left|remaining/.test(t)){if(activeFocus()){out=`${fmtT(RT.focus.total-(Date.now()-RT.focus.startedAt-RT.focus.pausedMs))} left.`}else out='No session running.'}
 else if(/(finish|complete|done with|i finished) (.+)/.test(t)){const k=t.match(/(finish|complete|done with|i finished) (.+)/)[2];if(completeByName(k)){out=`Marked "${k}" complete. Well done, Sir.`}else if(activeFocus()){completeFocus();out='Session complete. Nice work.'}else out=`I could not find "${k}".`}
 else if(/mark.*complete|complete that|finish that/.test(t)){if(activeFocus()){completeFocus();out='Session complete.'}else{const o=S.tasks.find(x=>x.status!=='done');if(o){o.status='done';o.updatedAt=Date.now();save();out=`Marked "${o.title}" complete.`}else out='Nothing open to complete.'}}
 else if(/remind me at (\d{1,2})(?::(\d{2}))?\s*(am|pm)?/.test(t)){const m=t.match(/remind me at (\d{1,2})(?::(\d{2}))?\s*(am|pm)?/);let h=+m[1];if(m[3]==='pm'&&h<12)h+=12;const d=new Date();d.setHours(h,+(m[2]||0),0,0);const r={id:uid(),title:text,time:d.getTime(),enabled:true};S.rems.push(r);save();log('reminder',{ev:'create',id:r.id});out=`Reminder set for ${hm(d)}. I will notify you.`}
 else if(/remind me in (\d+)\s*(min|hour)/.test(t)){const m=t.match(/remind me in (\d+)\s*(min|hour)/);const d=new Date(Date.now()+(+m[1])*(m[2]==='hour'?3600000:60000));S.rems.push({id:uid(),title:text,time:d.getTime(),enabled:true});save();out=`Reminder set for ${hm(d)}.`}
 else if(/add task (.+)/.test(t)){const ti=cap(t.match(/add task (.+)/)[1]);S.tasks.push({id:uid(),title:ti,priority:'Medium',status:'todo',fixed:false,createdAt:Date.now(),updatedAt:Date.now()});save();out=`Task "${ti}" added.`}
 else if(/move.*workout to (\d{1,2})(?::(\d{2}))?\s*(am|pm|)/.test(t)){const m=t.match(/move.*workout to (\d{1,2})(?::(\d{2}))?\s*(am|pm)?/);let h=+m[1];if(m[3]==='pm'&&h<12)h+=12;if(m[3]==='am'&&h===12)h=0;if(!m[3]&&h<12)h+=12;const d=new Date();d.setHours(h,+(m[2]||0),0,0);upsertAct('workout','Workout',d,30);out=`Workout moved to ${hm(d)}.`}
 else if(/move (.+) to tomorrow/.test(t)){const k=t.match(/move (.+) to tomorrow/)[1];const a=S.acts.find(x=>x.title.toLowerCase().includes(k)&&x.status!=='done');if(a){const s=new Date(a.start);s.setDate(s.getDate()+1);const e=new Date(a.end);e.setDate(e.getDate()+1);a.start=s.getTime();a.end=e.getTime();save();out=`Moved "${a.title}" to tomorrow.`}else out='I could not find that event.'}
 else if(/cancel|delete that/.test(t)){const o=S.tasks.find(x=>x.status!=='done');if(o){o.status='cancelled';save();out=`Cancelled "${o.title}".`}else out='Nothing to cancel.'}
 else if(/remember (.+)/.test(t)){S.mem.push({id:uid(),category:'note',key:'note',value:t.match(/remember (.+)/)[1],createdAt:Date.now(),updatedAt:Date.now()});save();out='Remembered, Sir.'}
 else if(/what do you remember|my routine|my preferences/.test(t)){out=S.mem.length?('I remember: '+S.mem.slice(-5).map(m=>m.value).join('; ')+'.'):'I have no stored memories yet. Say "remember ..." to teach me.'}
 else if(/forget|delete.*(memory|preference|history)/.test(t)){S.mem=[];save();out='Cleared stored preferences.'}
 else if(/prayer|maghrib|fajr|salah|namaz/.test(t)){const n=nextPrayer();out=n?`Next prayer: ${n.name} at ${n.time} (in ${n.mins} min).`:'Loading prayer times…'}
 else if(/quran/.test(t)){const q=S.quran.find(q=>q.date===todayStr());out=q?`Quran today: ${q.progress}.`:'Quran is pending today. Say "log quran" from the Quran tab after reading.'}
 else if(/goal/.test(t)){out=S.goals.length?`You have ${S.goals.length} goals. Top: ${S.goals[0].title} at ${goalPct(S.goals[0])}%.`:'No goals yet. Open Goals to add one.'}
 else if(/thank|shukran|jazak/.test(t)){out='Always at your service, Sir.'}
 else if(/dizzy|hurt|pain|don't feel well|dont feel/.test(t)){if(RT.workout)RT.workout.state='PAUSED';out='Stop the exercise and rest. Sit down, breathe, drink water. Do not continue if you feel unwell.'}
 else{out='I understood "'+text+'". I can: start/pause study, manage tasks, set reminders, move workouts, or brief you. Try "what should I do?"'}
 }catch(e){out='I could not do that right now. Try again.'}
 RT.chat.push({from:'ai',text:out});speak(out);render();save();
}
const cap=s=>s?s.charAt(0).toUpperCase()+s.slice(1):s;
function brief(){const n=nextEv(),st=todayStats(),pend=S.tasks.filter(t=>t.status!=='done').length;return`Today: ${pend} open tasks, ${Math.round(st.study/60000)} min studied.${n?` Next: ${n.title} in ${n.mins} min.`:' No upcoming events.'} ${suggestion()}`}

<button class="btn warn" onclick="if(confirm('Delete ALL LIFEOS data?')){localStorage.removeItem(LS);location.reload()}">Delete my data</button></div>
<div class="sub" style="margin-top:10px">Privacy: camera only on explicit Start · memory inspectable & deletable · keys server-side only · offline: schedule, timers, progress keep working.</div></div>`}
}
/* actions */
function addTask(){const t=$('#tT').value.trim();if(!t)return toast('Type a task first');S.tasks.push({id:uid(),title:cap(t),priority:$('#tP').value,status:'todo',fixed:false,createdAt:Date.now(),updatedAt:Date.now()});save();log('task',{ev:'create'});render()}
function taskDone(id){const t=S.tasks.find(x=>x.id===id);t.status='done';t.updatedAt=Date.now();save();render()}
function taskDel(id){S.tasks=S.tasks.filter(x=>x.id!==id);save();render()}
function addAct(){const t=$('#aT').value.trim();if(!t)return toast('Title first');const[sH,sM]=$('#aS').value.split(':').map(Number);const d=new Date();d.setHours(sH,sM,0,0);upsertAct($('#aY').value,cap(t),d,+$('#aD').value||30);const a=S.acts[S.acts.length-1];a.fixed=$('#aF').checked;save();render()}
function actDone(id){S.acts.find(x=>x.id===id).status='done';save();render()}
function actDel(id){S.acts=S.acts.filter(x=>x.id!==id);save();render()}
function pauseW(){if(RT.workout)RT.workout.state='PAUSED';render()}
function resumeW(){if(RT.workout)RT.workout.state='ACTIVE';render()}
function newSet(){if(!RT.workout)return;RT.workout.sets.push({n:RT.workout.sets.length+1,reps:0});speak('Starting set '+(RT.workout.sets.length));render()}
function switchEx(e){if(!RT.workout)return;RT.workout.exercise=e;RT.workout.sets.push({n:RT.workout.sets.length+1,reps:0});RT.workout.state='ACTIVE';speak('Switching to '+e);render()}
function togglePray(n){const k=todayStr()+n;S.prayDone[k]=!S.prayDone[k];save();render()}
function logQuran(){const p=$('#qP').value||'Reading';S.quran.push({id:uid(),date:todayStr(),duration:+$('#qD').value||15,progress:p,notes:''});save();log('quran',{ev:'log'});toast('Quran logged, Sir');render()}
function addGoal(){const t=$('#gT').value.trim();if(!t)return;S.goals.push({id:uid(),title:cap(t),description:'',deadline:'',priority:'Medium',progress:0,milestones:[]});save();render()}
function addMs(gid){const i=$('#ms-'+gid);if(!i||!i.value.trim())return;S.goals.find(g=>g.id===gid).milestones.push({title:i.value.trim(),done:false});save();render()}
function togMs(gid,ix){const m=S.goals.find(g=>g.id===gid).milestones[ix];m.done=!m.done;save();render()}
function delGoal(id){S.goals=S.goals.filter(g=>g.id!==id);save();render()}
function addRem(){const t=$('#rT').value||'Reminder';const[h,m]=$('#rH').value.split(':').map(Number);const d=new Date();d.setHours(h,m,0,0);S.rems.push({id:uid(),title:t,time:d.getTime(),enabled:true});save();render()}
function togRem(id){const r=S.rems.find(x=>x.id===id);r.enabled=!r.enabled;save();render()}
function delRem(id){S.rems=S.rems.filter(x=>x.id!==id);save();render()}
function delMem(id){S.mem=S.mem.filter(x=>x.id!==id);save();render()}
render();loadPrayer();setInterval(()=>{if(V==='home')render()},30000);
</script>
</body>
